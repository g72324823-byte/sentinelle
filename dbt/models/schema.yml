version: 2
models:
  - name: stg_agents
    columns:
      - name: agent_id
        data_tests: [unique, not_null]
      - name: type_agent
        data_tests:
          - accepted_values: {arguments: {values: ['AGENT', 'MARCHAND']}}
  - name: stg_transactions
    columns:
      - name: tx_id
        data_tests: [unique, not_null]
      - name: type_tx
        data_tests:
          - accepted_values:
              arguments: {values: ['PAIEMENT', 'TRANSFERT', 'RETRAIT', 'DEPOT', 'FACTURE', 'RECHARGE']}
  - name: fct_kpi_journalier
    description: Une ligne par jour et par pays
    # TODO : test d'unicité sur (jour, pays), contrat de données (contract: enforced)
